[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="adaptive-ai-evaluation-lab"
version="0.6.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","sqlalchemy>=2,<3","pydantic>=2.8,<3","pydantic-settings>=2.4,<3","httpx>=0.27,<1", "numpy>=1.26,<3", "gymnasium>=1.0,<2"]
[project.optional-dependencies]
rl=["stable-baselines3>=2.4,<3"]
dev=["pytest>=8,<9","pytest-asyncio>=0.24,<1"]
[tool.setuptools.packages.find]
include=["app*"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
